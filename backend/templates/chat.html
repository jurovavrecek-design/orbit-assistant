<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>ORBIT Assistant</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#f3f5f9;
}

body{
    display:flex;
    flex-direction:column;
}

.header{
    display:none;
}

#chat-window{
    flex:1;
    overflow-y:auto;
    padding:25px;
    display:flex;
    flex-direction:column;
    gap:18px;
}

#question:disabled{

    opacity:.7;

}

button:disabled{

    opacity:.5;

    cursor:not-allowed;

}

.user{
    align-self:flex-end;
    background:#2563eb;
    color:white;
    padding:16px 18px;
    border-radius:24px 24px 6px 24px;
    max-width:80%;
    box-shadow:0 2px 10px rgba(37,99,235,.25);
}

.assistant{
    align-self:flex-start;
    background:white;
    max-width:90%;
    padding:20px;
    border-radius:24px 24px 24px 6px;
    box-shadow:
            0 2px 8px rgba(0,0,0,.08),
            0 8px 20px rgba(0,0,0,.05);
}

.message-header{
    font-size:13px;
    color:#6b7280;
    margin-bottom:10px;
    font-weight:600;
}

.assistant ul{
    padding-left:20px;
}

.assistant li{
    margin-bottom:8px;
}

.assistant p{
    line-height:1.7;
}

.assistant h1,
.assistant h2,
.assistant h3{
    color:#111827;
}

.assistant pre{
    background:#111827;
    color:white;
    padding:15px;
    border-radius:14px;
    overflow-x:auto;
}

.assistant code{
    background:#eef2ff;
    padding:2px 6px;
    border-radius:6px;
}

.sources{
    margin-top:20px;
    padding-top:15px;
    border-top:1px solid #e5e7eb;
}

.sources-title{
    font-size:12px;
    color:#6b7280;
    margin-bottom:10px;
}

.source-chip{
    display:inline-block;
    padding:7px 12px;
    margin:4px;
    background:#eef2ff;
    color:#4f46e5;
    border-radius:20px;
    font-size:12px;
}

.bottom{
    background:white;
    padding:15px;
    border-top:1px solid #ddd;
    display:flex;
    gap:12px;
    box-shadow:0 -3px 12px rgba(0,0,0,.05);
}

#question{
    flex:1;
    border:none;
    background:#f3f4f6;
    border-radius:25px;
    padding:13px 16px;
    font-size:14px;
    outline:none;
}

button{
    width:44px;
    height:44px;
    border:none;
    border-radius:50%;
    background:#2563eb;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:scale(1.05);
}


.thinking{
    color:#6b7280;
    font-style:italic;
}

.loading::after{
    content:"";
    animation:dots 1.5s infinite;
}

@keyframes dots{

0%{
content:"";
}

33%{
content:".";
}

66%{
content:"..";
}

100%{
content:"...";
}

}

</style>

</head>

<body>

<div class="header"></div>

<div id="chat-window">

<div class="assistant">

<div class="message-header">

🧠 ORBIT Assistant

</div>

👋 Ask me anything about ORBIT, Salesforce or development.

</div>

</div>

<div class="bottom">

<input
id="question"
placeholder="Ask ORBIT..."
onkeypress="handleKey(event)"
>

<button id="send-button" onclick="sendQuestion()">

➜

</button>

</div>

<script>

function handleKey(event){

    if(event.key==="Enter"){
        sendQuestion();
    }

}


async function sendQuestion(){

    const input = document.getElementById("question");

    const question = input.value.trim();

    const answerId = "answer-" + Date.now();

    if(question===""){
        return;
    }

    input.disabled = true;

    const button =
        document.getElementById(
            "send-button"
        );

    button.disabled = true;

    if(question===""){
        return;
    }

    const chat = document.getElementById("chat-window");

    //
    // User bubble
    //
    chat.innerHTML += `
        <div class="user">
            ${question}
        </div>
    `;

    //
    // Empty assistant bubble
    //
    chat.innerHTML += `

    <div class="assistant">

        <div id="${answerId}" class="thinking loading">

            Thinking

        </div>

    </div>

    `;

    input.value="";

    chat.scrollTop = chat.scrollHeight;

    //
    // Start streaming
    //
    const response = await fetch("/chat/stream",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            question:question
        })

    });

    const reader = response.body.getReader();

    const decoder = new TextDecoder();

    let answer = "";

    const answerDiv =
        document.getElementById(answerId);

    try{

        while(true){

            const {done,value} = await reader.read();

            if(done){
                break;
            }

            answer += decoder.decode(value);

            answerDiv.classList.remove(
                "thinking",
                "loading"
            );

            answerDiv.innerHTML =
                marked.parse(answer);

            chat.scrollTop =
                chat.scrollHeight;

        }

    }
    catch(e){

        answerDiv.classList.remove(
            "thinking",
            "loading"
        );

        answerDiv.innerHTML = `

            ⚠ Error generating response.

        `;

    }
    finally{

        input.disabled = false;

        button.disabled = false;

        input.focus();

    }

}


</script>

</body>
</html>
